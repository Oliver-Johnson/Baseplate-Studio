name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if index.html is out of date with src/, if either script block has a
      # syntax error, if ui.js references an id the template lacks, or if a
      # display:none element is never un-hidden.
      - run: node build.js --check
      # Geometry audits: footprint/height against the published spec, zmin >= 0,
      # real-mesh cross-sections, and bin-to-socket clearance derived independently.
      - run: node test/bin-audit.js
      - run: node test/fit-check.js
      # Plates are watertight now. Magnets and screws are quarantined by name inside
      # the audit, which fails if a healthy case regresses or a quarantined one starts
      # passing without being taken off the list.
      - run: node test/plate-audit.js
      # A layout travels in the URL hash; it must survive the round trip byte for byte.
      - run: node test/hash-roundtrip.js
      - run: node test/seo-check.js

  # Everything above tests the geometry and the build. This tests the page: place
  # bins, carve, merge, resize, and assert what the interface actually did. Every
  # case here is a bug that shipped, because until now nothing but hand-testing
  # would have caught one.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the pages are static and load over file://, so there is no server to start
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
